name: ulsavam_app
description: Hyperlocal Kerala events and festival discovery mobile app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  geolocator: ^10.1.0
  geocoding: ^5.0.0
  intl: ^0.20.0
  google_fonts: ^6.1.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  table_calendar: ^3.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
